name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Only runs on push to main, not on every PR — no preview deployments
  # exist to test against, and this is the gate before production, not a
  # per-PR check. See docs/runbooks/runbook.md "Deployment".
  e2e:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          # proxy.ts refreshes the Supabase session on every request (including
          # the landing page), so e2e needs a real, reachable Supabase project
          # (see docs/decisions/0005-multi-user-supabase-auth.md). These repo
          # secrets are a human-only setup step, same as the Vercel env vars.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Vercel's own git-triggered auto-deploys are disabled (vercel.json
  # git.deploymentEnabled: false) — this Deploy Hook call is the only
  # thing that creates a production deployment, and only fires once ci
  # and e2e have both passed on main. See docs/runbooks/runbook.md
  # "Deployment" for the one-time Deploy Hook setup.
  deploy-production:
    if: github.event_name == 'push'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deployment
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
